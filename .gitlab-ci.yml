# Aether - GitLab CI/CD Multi-Channel Pipeline (Stable & Beta)
image: node:22-alpine

stages:
  - test
  - build
  - deploy

variables:
  PRODUCT_NAME: "Aether"
  GITLAB_REGISTRY: "registry.gitlab.com/jk9576/aether"

test_modules:
  stage: test
  before_script:
    - apk add --no-cache sqlite bash python3
    - cp -n .env.example .env || true
    - mkdir -p ~/.aether && cp -n .env.example ~/.aether/.env || true
  script:
    - npm install --silent
    - node test/run-tests.js
    - echo "All Aether tests and integrity checks passed."

build_stable:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Packaging Aether Stable channel..."
    - rm -rf /tmp/aether_pack && mkdir -p /tmp/aether_pack
    - cp -r package.json out scripts /tmp/aether_pack/
    - npx --yes @electron/asar pack /tmp/aether_pack app.asar
    - echo "Stable build completed."
  artifacts:
    name: "Aether-Stable-v0.0.1"
    paths:
      - app.asar
      - version.json
    expire_in: 30 days

build_beta:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta"'
  script:
    - echo "Packaging Aether Beta channel..."
    - rm -rf /tmp/aether_pack && mkdir -p /tmp/aether_pack
    - cp -r package.json out scripts /tmp/aether_pack/
    - npx --yes @electron/asar pack /tmp/aether_pack app.asar
    - echo "Beta build completed."
  artifacts:
    name: "Aether-Beta-v0.0.1"
    paths:
      - app.asar
      - version.json
    expire_in: 30 days

deploy_release:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "beta"'
  script:
    - echo "Publishing Aether $CI_COMMIT_REF_NAME release to GitLab..."

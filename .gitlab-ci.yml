# Aether - GitLab CI/CD Pipeline
stages:
  - build
  - test
  - deploy

variables:
  PRODUCT_NAME: "Aether"
  GITLAB_REGISTRY: "registry.gitlab.com/jk9576/aether"

build_application:
  stage: build
  tags:
    - macos
  script:
    - echo "Packaging Aether ASAR bundle..."
    - npx --yes @electron/asar pack out /tmp/app.asar
    - echo "Package completed successfully."
  artifacts:
    name: "Aether-macOS-bundle"
    paths:
      - /tmp/app.asar
    expire_in: 30 days

test_modules:
  stage: test
  script:
    - node -c out/main/index.js
    - node -c out/preload/index.js
    - echo "Syntax and integrity checks passed."

deploy_release:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "Publishing Aether release $CI_COMMIT_TAG to GitLab..."

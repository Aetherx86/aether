<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aether Browser — Powered by Ladybird</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --surface: #252525;
      --surface-subtle: #2d2d2d;
      --border: #3a3a3a;
      --text: #e0e0e0;
      --text-muted: #888888;
      --accent: #553fc4; /* Ladybird Violet */
      --accent-hover: #6851d6;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Browser Navbar */
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: #2a1b4e;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      color: #cab5ff;
      user-select: none;
    }

    .btn {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover {
      background: #383838;
      border-color: #555;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover {
      background: var(--accent-hover);
    }

    .url-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2px 8px;
    }
    .url-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .url-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      padding: 4px 0;
    }

    /* Sub-nav quick links */
    .quick-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 14px;
      background: #1c1c1c;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }
    .quick-link {
      color: #a5a6f2;
      text-decoration: none;
      cursor: pointer;
    }
    .quick-link:hover {
      text-decoration: underline;
    }

    /* Main Viewport Container */
    .viewport-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* AI Summary Side-Drawer */
    .ai-drawer {
      position: absolute;
      top: 0;
      right: -380px;
      width: 360px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 16px rgba(0,0,0,0.4);
      transition: right 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    .ai-drawer.open {
      right: 0;
    }
    .drawer-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 13px;
      color: #cab5ff;
    }
    .drawer-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <!-- Nav Toolbar -->
  <div class="nav-bar">
    <div class="badge">🐞 Ladybird</div>
    <button class="btn" id="btnBack" title="Back">←</button>
    <button class="btn" id="btnForward" title="Forward">→</button>
    <button class="btn" id="btnReload" title="Reload">↻</button>
    <button class="btn" id="btnHome" title="Ladybird Welcome">🏠</button>

    <div class="url-box">
      <input type="text" class="url-input" id="urlInput" value="ladybird://welcome" spellcheck="false" />
    </div>

    <button class="btn primary" id="btnGo">Go</button>
    <button class="btn" id="btnSummarize" title="Summarize with Gemini AI">✨ Summarize</button>
    <button class="btn" id="btnSaveDoc" title="Export as Word / Markdown">📄 Save</button>
  </div>

  <!-- Quick Links Bar -->
  <div class="quick-bar">
    <span>Ladybird Pages:</span>
    <span class="quick-link" data-url="ladybird://welcome">welcome</span>
    <span class="quick-link" data-url="ladybird://about">about</span>
    <span class="quick-link" data-url="ladybird://history">history</span>
    <span class="quick-link" data-url="ladybird://bookmarks">bookmarks</span>
    <span class="quick-link" data-url="ladybird://settings">settings</span>
    <span class="quick-link" data-url="ladybird://version">version</span>
    <span style="margin-left:auto;">Engine: LibWeb & SerenityOS Component Pipeline</span>
  </div>

  <!-- Viewport -->
  <div class="viewport-container">
    <iframe id="contentFrame"></iframe>

    <!-- AI Drawer -->
    <div class="ai-drawer" id="aiDrawer">
      <div class="drawer-header">
        <span>✨ Gemini AI Page Summary</span>
        <button class="btn" id="btnCloseDrawer" style="padding:2px 6px;">✕</button>
      </div>
      <div class="drawer-content" id="drawerContent">
        분석 중입니다... 잠시만 기다려주세요.
      </div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById("contentFrame");
    const urlInput = document.getElementById("urlInput");
    const btnGo = document.getElementById("btnGo");
    const btnBack = document.getElementById("btnBack");
    const btnForward = document.getElementById("btnForward");
    const btnReload = document.getElementById("btnReload");
    const btnHome = document.getElementById("btnHome");
    const btnSummarize = document.getElementById("btnSummarize");
    const btnSaveDoc = document.getElementById("btnSaveDoc");
    const aiDrawer = document.getElementById("aiDrawer");
    const btnCloseDrawer = document.getElementById("btnCloseDrawer");
    const drawerContent = document.getElementById("drawerContent");

    let historyStack = [];
    let historyIndex = -1;

    async function navigateTo(url) {
      if (!url.startsWith("http://") && !url.startsWith("https://") && !url.startsWith("ladybird://")) {
        if (url.includes(".") && !url.includes(" ")) {
          url = "https://" + url;
        } else {
          url = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
        }
      }

      urlInput.value = url;

      if (url.startsWith("ladybird://")) {
        const pageName = url.replace("ladybird://", "") || "welcome";
        try {
          if (window.hyperOffice && window.hyperOffice.browser) {
            const html = await window.hyperOffice.browser.getLadybirdPage(pageName);
            iframe.srcdoc = html;
          } else {
            iframe.srcdoc = `<h1 style="font-family:sans-serif;padding:2rem;">Ladybird: ${pageName}</h1>`;
          }
        } catch (e) {
          iframe.srcdoc = `<p style="padding:2rem;color:red;">Error loading Ladybird page: ${e.message}</p>`;
        }
      } else {
        iframe.removeAttribute("srcdoc");
        iframe.src = url;
      }

      if (historyStack[historyIndex] !== url) {
        historyStack = historyStack.slice(0, historyIndex + 1);
        historyStack.push(url);
        historyIndex++;
      }
    }

    btnGo.addEventListener("click", () => navigateTo(urlInput.value));
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") navigateTo(urlInput.value);
    });

    btnHome.addEventListener("click", () => navigateTo("ladybird://welcome"));
    btnReload.addEventListener("click", () => navigateTo(urlInput.value));
    btnBack.addEventListener("click", () => {
      if (historyIndex > 0) {
        historyIndex--;
        navigateTo(historyStack[historyIndex]);
      }
    });
    btnForward.addEventListener("click", () => {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        navigateTo(historyStack[historyIndex]);
      }
    });

    document.querySelectorAll(".quick-link").forEach(link => {
      link.addEventListener("click", () => navigateTo(link.dataset.url));
    });

    // Gemini AI Summary
    btnSummarize.addEventListener("click", async () => {
      aiDrawer.classList.add("open");
      drawerContent.textContent = "웹페이지 본문을 분석하고 요약하는 중입니다...";
      const currentUrl = urlInput.value;
      if (currentUrl.startsWith("ladybird://")) {
        drawerContent.textContent = `[Ladybird Internal Page]\n\nLadybird의 내장 시스템 화면(${currentUrl})입니다.\n독립형 웹 브라우징 엔진의 아키텍처 리소스를 보여줍니다.`;
        return;
      }

      try {
        if (window.hyperOffice && window.hyperOffice.browser) {
          const res = await window.hyperOffice.browser.summarize(currentUrl);
          if (res.ok) {
            drawerContent.textContent = res.summary;
          } else {
            drawerContent.textContent = "요약 실패: " + res.error;
          }
        } else {
          drawerContent.textContent = "AI 연결을 사용할 수 없습니다.";
        }
      } catch (err) {
        drawerContent.textContent = "오류: " + err.message;
      }
    });

    btnCloseDrawer.addEventListener("click", () => {
      aiDrawer.classList.remove("open");
    });

    // Save as Doc
    btnSaveDoc.addEventListener("click", async () => {
      const currentUrl = urlInput.value;
      const targetName = "webpage_capture_" + Date.now() + ".docx";
      const outPath = "~/Desktop/" + targetName;
      if (window.hyperOffice && window.hyperOffice.browser) {
        const res = await window.hyperOffice.browser.saveDoc(currentUrl, outPath);
        if (res.ok) alert("바탕화면에 워드 문서로 저장되었습니다: " + targetName);
        else alert("저장 실패: " + res.error);
      }
    });

    // Initial load
    const initialParam = new URLSearchParams(window.location.search).get("url");
    navigateTo(initialParam || "ladybird://welcome");
  </script>
</body>
</html>

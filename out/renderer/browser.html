<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aether Browser — Powered by Ladybird & Tor</title>
  <style>
    :root {
      --bg: #18181b;
      --surface: #27272a;
      --surface-subtle: #3f3f46;
      --border: #52525b;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --tor-green: #22c55e;
      --tor-bg: #14532d;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Browser Navbar */
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: #312e81;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      color: #c7d2fe;
      user-select: none;
    }

    .btn {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover {
      background: #52525b;
      border-color: #71717a;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover {
      background: var(--accent-hover);
    }

    .tor-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #15803d;
      background: #14532d;
      color: #86efac;
      transition: all 0.2s ease;
      user-select: none;
    }
    .tor-toggle.off {
      border-color: #52525b;
      background: #3f3f46;
      color: #a1a1aa;
    }
    .tor-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    .tor-toggle.off .tor-indicator {
      background: #71717a;
    }

    .url-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2px 10px;
    }
    .url-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .url-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      padding: 5px 0;
    }

    /* Sub-nav quick links */
    .quick-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      background: #1c1c1e;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      overflow-x: auto;
    }
    .quick-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #a5b4fc;
      text-decoration: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .quick-link:hover {
      background: rgba(255,255,255,0.1);
      color: #ffffff;
    }
    .quick-link.highlight {
      color: #67e8f9;
      font-weight: 500;
    }

    /* Main Viewport Container */
    .viewport-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      background: #ffffff;
    }

    webview {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    #ladybirdLocalView {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      background: #1b1924;
      overflow-y: auto;
    }

    /* AI Summary Side-Drawer */
    .ai-drawer {
      position: absolute;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 20px rgba(0,0,0,0.5);
      transition: right 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    .ai-drawer.open {
      right: 0;
    }
    .drawer-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 13px;
      color: #c7d2fe;
    }
    .drawer-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <!-- Nav Toolbar -->
  <div class="nav-bar">
    <div class="badge">🐞 Ladybird</div>
    <button class="btn" id="btnBack" title="Back">←</button>
    <button class="btn" id="btnForward" title="Forward">→</button>
    <button class="btn" id="btnReload" title="Reload">↻</button>
    <button class="btn" id="btnHome" title="Ladybird Welcome">🏠</button>

    <div class="url-box">
      <input type="text" class="url-input" id="urlInput" value="https://mail.proton.me" spellcheck="false" />
    </div>

    <button class="btn primary" id="btnGo">Go</button>

    <!-- Tor Mode Toggle -->
    <div class="tor-toggle" id="torToggle" title="Toggle Tor SOCKS5 Proxy Routing (Port 9050)">
      <span class="tor-indicator"></span>
      <span id="torLabel">🧅 Tor: ON</span>
    </div>

    <button class="btn" id="btnSummarize" title="Summarize with Gemini AI">✨ Summarize</button>
    <button class="btn" id="btnSaveDoc" title="Export as Word / Markdown">📄 Save</button>
  </div>

  <!-- Bookmarks & Quick Links Bar -->
  <div class="quick-bar">
    <span style="font-weight:600;color:#71717a;">Favorites:</span>
    <span class="quick-link highlight" data-url="https://mail.proton.me">✉️ Proton Mail</span>
    <span class="quick-link highlight" data-url="https://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion">🧅 DuckDuckGo (.onion)</span>
    <span class="quick-link" data-url="https://check.torproject.org">🛡️ Tor Check</span>
    <span class="quick-link" data-url="https://duckduckgo.com">🔍 DuckDuckGo</span>
    <span class="quick-link" data-url="ladybird://welcome">🐞 Ladybird Welcome</span>
    <span class="quick-link" data-url="ladybird://about">ℹ️ Ladybird About</span>
    <span style="margin-left:auto;font-size:11px;color:#71717a;">Engine: LibWeb & Tor SOCKS5 Tunnel</span>
  </div>

  <!-- Viewport -->
  <div class="viewport-container">
    <webview id="contentWebview"
             partition="persist:ladybird"
             allowpopups
             webpreferences="contextIsolation=no"
             src="https://mail.proton.me">
    </webview>

    <div id="ladybirdLocalView"></div>

    <!-- AI Drawer -->
    <div class="ai-drawer" id="aiDrawer">
      <div class="drawer-header">
        <span>✨ Gemini AI Page Summary</span>
        <button class="btn" id="btnCloseDrawer" style="padding:2px 6px;">✕</button>
      </div>
      <div class="drawer-content" id="drawerContent">
        페이지를 분석 중입니다... 잠시만 기다려주세요.
      </div>
    </div>
  </div>

  <script>
    const webview = document.getElementById("contentWebview");
    const localView = document.getElementById("ladybirdLocalView");
    const urlInput = document.getElementById("urlInput");
    const btnGo = document.getElementById("btnGo");
    const btnBack = document.getElementById("btnBack");
    const btnForward = document.getElementById("btnForward");
    const btnReload = document.getElementById("btnReload");
    const btnHome = document.getElementById("btnHome");
    const torToggle = document.getElementById("torToggle");
    const torLabel = document.getElementById("torLabel");
    const btnSummarize = document.getElementById("btnSummarize");
    const btnSaveDoc = document.getElementById("btnSaveDoc");
    const aiDrawer = document.getElementById("aiDrawer");
    const btnCloseDrawer = document.getElementById("btnCloseDrawer");
    const drawerContent = document.getElementById("drawerContent");

    let torEnabled = true;

    // Tor Status Initialization
    async function initTorStatus() {
      if (window.hyperOffice && window.hyperOffice.browser && window.hyperOffice.browser.getTorStatus) {
        try {
          const status = await window.hyperOffice.browser.getTorStatus();
          updateTorUi(status.torEnabled, status.active);
        } catch (e) {
          console.error("Tor status lookup failed:", e);
        }
      }
    }

    function updateTorUi(enabled, active) {
      torEnabled = enabled;
      if (enabled) {
        torToggle.classList.remove("off");
        torLabel.textContent = active ? "🧅 Tor: CONNECTED" : "🧅 Tor: STARTING";
      } else {
        torToggle.classList.add("off");
        torLabel.textContent = "🌐 Tor: OFF (Direct)";
      }
    }

    torToggle.addEventListener("click", async () => {
      const nextState = !torEnabled;
      if (window.hyperOffice && window.hyperOffice.browser && window.hyperOffice.browser.setTor) {
        const res = await window.hyperOffice.browser.setTor(nextState);
        updateTorUi(res.torEnabled, res.active);
        // Reload current page with new network routing
        webview.reload();
      }
    });

    initTorStatus();

    // Navigation Logic
    async function navigateTo(url) {
      if (!url) return;
      url = url.trim();

      if (!url.startsWith("http://") && !url.startsWith("https://") && !url.startsWith("ladybird://")) {
        if (url.includes(".") && !url.includes(" ")) {
          url = "https://" + url;
        } else {
          url = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
        }
      }

      urlInput.value = url;

      if (url.startsWith("ladybird://")) {
        const pageName = url.replace("ladybird://", "") || "welcome";
        try {
          if (window.hyperOffice && window.hyperOffice.browser) {
            const html = await window.hyperOffice.browser.getLadybirdPage(pageName);
            localView.innerHTML = html;
          } else {
            localView.innerHTML = `<h1 style="color:#fff;padding:2rem;">Ladybird: ${pageName}</h1>`;
          }
          webview.style.display = "none";
          localView.style.display = "block";
        } catch (e) {
          localView.innerHTML = `<p style="padding:2rem;color:red;">Error: ${e.message}</p>`;
        }
      } else {
        localView.style.display = "none";
        webview.style.display = "flex";
        try {
          webview.loadURL(url);
        } catch (e) {
          webview.src = url;
        }
      }
    }

    btnGo.addEventListener("click", () => navigateTo(urlInput.value));
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") navigateTo(urlInput.value);
    });

    btnHome.addEventListener("click", () => navigateTo("ladybird://welcome"));
    btnReload.addEventListener("click", () => {
      if (localView.style.display === "block") {
        navigateTo(urlInput.value);
      } else {
        webview.reload();
      }
    });

    btnBack.addEventListener("click", () => {
      if (webview.canGoBack && webview.canGoBack()) webview.goBack();
    });

    btnForward.addEventListener("click", () => {
      if (webview.canGoForward && webview.canGoForward()) webview.goForward();
    });

    document.querySelectorAll(".quick-link").forEach(link => {
      link.addEventListener("click", () => navigateTo(link.dataset.url));
    });

    // Webview Events
    webview.addEventListener("did-start-loading", () => {
      btnReload.textContent = "⏳";
    });

    webview.addEventListener("did-stop-loading", () => {
      btnReload.textContent = "↻";
    });

    webview.addEventListener("did-navigate", (e) => {
      urlInput.value = e.url;
    });

    webview.addEventListener("did-navigate-in-page", (e) => {
      urlInput.value = e.url;
    });

    webview.addEventListener("page-title-updated", (e) => {
      if (e.title) document.title = `${e.title} — Aether Browser`;
    });

    webview.addEventListener("new-window", (e) => {
      e.preventDefault();
      navigateTo(e.url);
    });

    // Gemini AI Summary
    btnSummarize.addEventListener("click", async () => {
      aiDrawer.classList.add("open");
      drawerContent.textContent = "웹페이지 본문을 분석하고 요약하는 중입니다...";
      const currentUrl = urlInput.value;
      if (currentUrl.startsWith("ladybird://")) {
        drawerContent.textContent = `[Ladybird Internal Page]\n\nLadybird의 내장 시스템 리소스(${currentUrl})입니다.\n완전 독립 브라우징 엔진의 아키텍처 스펙을 표시하고 있습니다.`;
        return;
      }

      try {
        if (window.hyperOffice && window.hyperOffice.browser) {
          const res = await window.hyperOffice.browser.summarize(currentUrl);
          if (res.ok) {
            drawerContent.textContent = res.summary;
          } else {
            drawerContent.textContent = "요약 실패: " + res.error;
          }
        } else {
          drawerContent.textContent = "AI 연결을 사용할 수 없습니다.";
        }
      } catch (err) {
        drawerContent.textContent = "오류: " + err.message;
      }
    });

    btnCloseDrawer.addEventListener("click", () => {
      aiDrawer.classList.remove("open");
    });

    // Save Doc
    btnSaveDoc.addEventListener("click", async () => {
      const currentUrl = urlInput.value;
      const targetName = "webpage_capture_" + Date.now() + ".docx";
      const outPath = "/Users/sushikim/Desktop/" + targetName;
      if (window.hyperOffice && window.hyperOffice.browser) {
        const res = await window.hyperOffice.browser.saveDoc(currentUrl, outPath);
        if (res.ok) alert("바탕화면에 워드 문서로 저장되었습니다: " + targetName);
        else alert("저장 실패: " + res.error);
      }
    });

    // Initial navigation
    const initialParam = new URLSearchParams(window.location.search).get("url");
    navigateTo(initialParam || "https://mail.proton.me");
  </script>
</body>
</html>
